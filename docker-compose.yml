services:
  postgres:
    image: postgres:15.5
    container_name: rolemodel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rolemodel
      POSTGRES_USER: rolemodel
      POSTGRES_PASSWORD: rolemodel
    ports:
      - "5432:5432"
    volumes:
      - rolemodel_pgdata:/var/lib/postgresql/data

volumes:
  rolemodel_pgdata:
